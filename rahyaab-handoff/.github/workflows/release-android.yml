name: Release Android build

# Manual only: builds a test APK on Expo's servers (EAS). Needs the EXPO_TOKEN repository secret
# and an eas.json in the repo root (run `npx eas-cli@latest build:configure` once, locally).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start EAS build
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
