# Settings for actions/dependency-review-action (.github/workflows/security.yml).
# A PR fails if it adds a package with a high or critical advisory.
#
# To accept an advisory on purpose, add an allow-ghsas list here with the GHSA ID, the reason and a
# removal date. (A temporary list for the moved Expo 57 prototype was removed after PR #4 merged.)
fail-on-severity: high
