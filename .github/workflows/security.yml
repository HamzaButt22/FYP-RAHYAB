# Security checks: secrets, static analysis, vulnerable dependencies. PRs, main and weekly.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * 0" # Sunday 03:00 PKT: full-history secret scan and audits

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Code scanning on a private repository needs GitHub's paid Code Security add-on; skip instead of failing.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  dependency-review:
    name: dependency review
    # Needs the paid Code Security add-on on a private repository; the dependency audits job still runs.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          config-file: ./.github/dependency-review-config.yml

  audit:
    name: dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit (backend)
        run: |
          for d in backend/api backend/scoring; do
            (cd "$d" && uv export --frozen --no-dev --no-emit-project --no-emit-package rahyaab-scoring --no-hashes > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --strict)
          done
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - name: pnpm audit (frontend)
        run: |
          for d in frontend/mobile frontend/dashboard; do
            (cd "$d" && pnpm audit --prod --audit-level high)
          done
