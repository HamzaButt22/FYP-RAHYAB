<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" font-family="Arial, Helvetica, sans-serif">
  <!-- Concept mockup: Activity Stage — Makers' Hall water pump bench (R). Original artwork (design proposal v1.0). -->
  <rect width="360" height="760" fill="#F1E3CC"/>
  <rect x="0" y="0" width="360" height="56" fill="#FFFFFF"/>
  <rect x="10" y="12" width="32" height="32" rx="9" fill="#9A7B5E"/>
  <path d="M19 34 l10 -10 m-3 -4 a5 5 0 1 0 7 7" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="52" y="26" font-size="15" font-weight="700" fill="#1F2A2E">Water pump</text>
  <text x="52" y="44" font-size="12" fill="#52626A">Candles left: 6 of 10</text><g fill="#D9822B"><rect x="190" y="34" width="6" height="12" rx="2"/><rect x="200" y="34" width="6" height="12" rx="2"/><rect x="210" y="34" width="6" height="12" rx="2"/><rect x="220" y="34" width="6" height="12" rx="2"/><rect x="230" y="34" width="6" height="12" rx="2"/><rect x="240" y="34" width="6" height="12" rx="2"/></g><g fill="#E4D9C6"><rect x="250" y="34" width="6" height="12" rx="2"/><rect x="260" y="34" width="6" height="12" rx="2"/><rect x="270" y="34" width="6" height="12" rx="2"/><rect x="280" y="34" width="6" height="12" rx="2"/></g><g fill="#F3C089"><circle cx="193" cy="31" r="2.5"/><circle cx="203" cy="31" r="2.5"/><circle cx="213" cy="31" r="2.5"/><circle cx="223" cy="31" r="2.5"/><circle cx="233" cy="31" r="2.5"/><circle cx="243" cy="31" r="2.5"/></g>
  <!-- maker card -->
  <rect x="12" y="66" width="336" height="58" rx="14" fill="#FFFFFF"/>
  <circle cx="44" cy="95" r="20" fill="#D7EDE8"/><circle cx="44" cy="92" r="9" fill="#C99A6E"/><path d="M34 88 q10 -14 20 0z" fill="#3F9283"/><rect x="34" y="101" width="20" height="10" rx="4" fill="#9A7B5E"/>
  <text x="74" y="90" font-size="13" font-weight="700" fill="#1F2A2E">Rabia</text>
  <text x="74" y="108" font-size="13" fill="#1F2A2E">"Let's get this pump working again."</text>
  <!-- work scene -->
  <rect x="12" y="134" width="336" height="330" rx="16" fill="#E9D8BC"/>
  <rect x="150" y="190" width="60" height="200" rx="8" fill="#7E8790"/>
  <rect x="140" y="182" width="80" height="18" rx="6" fill="#5E6770"/>
  <path d="M210 210 l60 -30" stroke="#5E6770" stroke-width="10" stroke-linecap="round"/>
  <!-- pipe slots -->
  <rect x="100" y="390" width="56" height="22" rx="6" fill="none" stroke="#1F7A6D" stroke-width="3" stroke-dasharray="6 5"/>
  <rect x="210" y="390" width="56" height="22" rx="6" fill="#9AA8B5"/>
  <rect x="60" y="414" width="44" height="22" rx="6" fill="#9AA8B5"/>
  <rect x="262" y="414" width="44" height="22" rx="6" fill="none" stroke="#9AA8B5" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="128" cy="401" r="22" fill="#F3C089" opacity="0.45"/>
  <text x="128" y="440" font-size="11" fill="#145A50" text-anchor="middle" font-weight="700">drop here</text>
  <!-- player character small at edge -->
  <circle cx="56" cy="250" r="12" fill="#D39B6E"/><path d="M44 248 q12 -18 24 0 v6 q-12 -6 -24 0z" fill="#2F7F9E"/><rect x="45" y="262" width="22" height="22" rx="6" fill="#2F7F9E"/>
  <!-- step pips -->
  <text x="20" y="490" font-size="12" font-weight="700" fill="#52626A">STEP 2 OF 6</text>
  <g fill="#1F7A6D"><circle cx="118" cy="486" r="6"/><circle cx="136" cy="486" r="6"/></g>
  <g fill="#E4D9C6"><circle cx="154" cy="486" r="6"/><circle cx="172" cy="486" r="6"/><circle cx="190" cy="486" r="6"/><circle cx="208" cy="486" r="6"/></g>
  <rect x="236" y="474" width="112" height="24" rx="12" fill="#FBE6D0"/><text x="292" y="490" font-size="11" fill="#9A5B0B" text-anchor="middle" font-weight="700">★ Extra: grease</text>
  <text x="20" y="520" font-size="14" fill="#1F2A2E">Drag the pipe section into the gap</text>
  <!-- tray -->
  <rect x="12" y="532" width="336" height="80" rx="14" fill="#FFFFFF"/>
  <rect x="40" y="556" width="70" height="30" rx="8" fill="#9AA8B5" stroke="#1F7A6D" stroke-width="3"/>
  <rect x="140" y="556" width="70" height="30" rx="8" fill="#9AA8B5"/>
  <rect x="240" y="560" width="54" height="24" rx="8" fill="#C9A97E"/>
  <text x="75" y="604" font-size="10" fill="#52626A" text-anchor="middle">picked up</text>
  <!-- footer -->
  <rect x="12" y="640" width="130" height="56" rx="16" fill="#FFFFFF" stroke="#E4D9C6" stroke-width="2"/>
  <text x="77" y="674" font-size="16" font-weight="700" fill="#1F2A2E" text-anchor="middle">Leave</text>
  <rect x="152" y="640" width="196" height="56" rx="16" fill="#E4D9C6"/>
  <text x="250" y="666" font-size="15" font-weight="700" fill="#52626A" text-anchor="middle">Finish ✓</text>
  <text x="250" y="684" font-size="11" fill="#52626A" text-anchor="middle">uses 1 candle</text>
  <text x="180" y="740" font-size="9" fill="#52626A" text-anchor="middle">Concept mockup — not final art</text>
</svg>
