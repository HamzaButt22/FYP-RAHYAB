# React Native builds C++ code with CMake, and Windows builds break when those paths get too long.
# pnpm's default nested layout (node_modules/.pnpm/<name>@<hash>/node_modules/...) makes them much longer,
# so the mobile app uses a flat node_modules folder. Package versions are unchanged (same lockfile).
# Windows developers also need CMake 3.31.6 (see README.md).
nodeLinker: hoisted
allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - expo-router@58.0.27
  - expo-dev-client@58.0.20
  - expo-dev-launcher@58.0.20
overrides:
  # GHSA-86w9-cpqp-85rv and related: node-forge <=1.4.0 (pulled in by @expo/cli). 1.4.1 is inside Expo's ^1.4.0 range.
  node-forge: ^1.4.1
