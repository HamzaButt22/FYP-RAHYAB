# The jobs worker (retention, partitions, rescoring, O*NET refresh) and the nightly backup CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jobs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jobs
          image: rahyaab-api
          command: ["python", "-m", "rahyaab_api.jobs"]
          envFrom:
            - configMapRef: { name: rahyaab-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: rahyaab-api, key: jobs-database-url }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  schedule: "0 21 * * *"   # 21:00 UTC = 02:00 PKT
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: rahyaab-backup   # infra/backup: pg_dump + age + rclone
              args: ["once"]
              envFrom:
                - secretRef: { name: rahyaab-backup }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
