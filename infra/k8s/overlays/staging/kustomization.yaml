# Staging overlay. Render: kubectl kustomize infra/k8s/overlays/staging
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahyaab-staging
resources:
  - ../../base
images:
  - name: rahyaab-api
    newName: ghcr.io/hamzabutt22/rahyaab-api
    newTag: latest-main
  - name: rahyaab-dashboard
    newName: ghcr.io/hamzabutt22/rahyaab-dashboard
    newTag: latest-main
  - name: rahyaab-backup
    newName: ghcr.io/hamzabutt22/rahyaab-backup
    newTag: latest-main
patches:
  - target: { kind: Namespace, name: rahyaab }
    patch: |-
      - op: replace
        path: /metadata/name
        value: rahyaab-staging
  - target: { kind: ConfigMap, name: rahyaab-config }
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: staging
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: https://dashboard.staging.rahyaab.pk
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target: { kind: Ingress, name: rahyaab }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: [staging.api.rahyaab.pk, dashboard.staging.rahyaab.pk]
      - op: replace
        path: /spec/rules/0/host
        value: staging.api.rahyaab.pk
      - op: replace
        path: /spec/rules/1/host
        value: dashboard.staging.rahyaab.pk
