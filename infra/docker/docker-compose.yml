# Rahyaab services. Base file for every environment; production adds docker-compose.prod.yml.
# Run from this folder (infra/docker). Secrets come from .env and ./secrets/ (both git-ignored).
# Needs Docker Compose v2.24 or newer (the prod file uses the !reset tag).
name: rahyaab

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"            # local only; production removes this (prod file)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  api:
    image: ${API_IMAGE:-rahyaab-api:dev}
    build:
      context: ../..                      # repository root (the image needs backend/ and database/)
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    # Only the variables the API needs; never the whole .env (it also holds the admin DB password).
    environment:
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${API_DB_USER}:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ALLOWED_ORIGINS: ${DASHBOARD_ORIGIN}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"
    secrets:
      - data_key_wrapper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 15s
      retries: 3

  # One-shot: runs migrations before a new API version starts (expand -> migrate -> contract).
  migrate:
    image: ${API_IMAGE:-rahyaab-api:dev}
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}   # the admin role creates the schema and roles
    depends_on:
      db:
        condition: service_healthy
    profiles: ["migrate"]
    restart: "no"

  jobs:
    image: ${API_IMAGE:-rahyaab-api:dev}
    restart: unless-stopped
    # retention, partitions (via the owner role), rescoring, O*NET refresh
    command: ["python", "-m", "rahyaab_api.jobs"]
    healthcheck:
      disable: true                             # the image's HTTP check is for the API only
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql+psycopg://${JOBS_DB_USER}:${JOBS_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      ONET_USERNAME: ${ONET_USERNAME:-}
      ONET_PASSWORD: ${ONET_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    user: "10001:10001"

  # Nightly at 02:00 PKT: pg_dump -> age (public key only) -> rclone to off-site storage (infra/backup).
  backup:
    image: ${BACKUP_IMAGE:-rahyaab-backup:dev}
    build:
      context: ../backup
    restart: unless-stopped
    env_file: ./secrets/backup.env              # PGHOST=db, PGUSER/PGPASSWORD (read-only role), AGE_RECIPIENT, RCLONE_*
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    profiles: ["backup"]                        # local: start with --profile backup; always on in prod

secrets:
  data_key_wrapper:
    file: ./secrets/data_key_wrapper            # chmod 600, never committed, never in a backup

volumes:
  pgdata:
