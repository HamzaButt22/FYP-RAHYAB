[project]
name = "rahyaab-scoring"
version = "0.1.0"
description = "Rahyaab scoring: interest and ability estimation (M1, M2), congruence ranking and eligibility gates (M3)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1", "scipy>=1.14"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rahyaab_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
