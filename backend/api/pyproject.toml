[project]
name = "rahyaab-api"
version = "0.1.0"
description = "Rahyaab API: pseudonymous accounts, consent, telemetry, scoring, sharing and dashboard (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "rahyaab-scoring",
  "pyjwt>=2.10",
  "cryptography>=44",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "pyyaml>=6.0",
  "types-pyyaml>=6.0",
]

[tool.uv.sources]
rahyaab-scoring = { path = "../scoring", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rahyaab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
